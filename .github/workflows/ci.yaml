name: CI

on:
  push:
    branches: [ main ]
  pull_request: {}
  workflow_dispatch: {} # manual trigger for testing

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: TEMPORARY DIAGNOSTICS
        run: |
          go mod download
          go tool task temp_diagnostics

      # we're using task as a tool now, so we don't need this?
      # - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Run lint, test, and build
        run: |
          go mod download
          go tool task lint
          go tool task test
          go tool task build

      - name: Upload test coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # 7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # also upload the coverage to codacy
      - name: Upload test coverage to Codacy
        run: |
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report --force-coverage-parser go -r .coverage/coverage.out
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

      # doing a release:test is likely overkill... unless we're hitting issues
      # where the build is successful, and we bump the version, and yet the
      # release itself fails, we can skip this.
      #
      # - run: task release:test

  release:
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # we're using task as a tool now, so we don't need this?
      # - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Check if release is needed
        id: check-bump
        env:
          GITHUB_OUTPUT: ${{ env.GITHUB_OUTPUT }}
        run: |
          go mod download
          go tool task tag-release

      - if: ${{ steps.check-bump.output.do_release == 'true' }}
        name: Install syft tools
        run: |
          curl -sSfL https://get.anchore.io/syft | sudo sh -s -- -b /usr/local/bin

      - if: ${{ steps.check-bump.output.do_release == 'true' }}
        run: task release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

