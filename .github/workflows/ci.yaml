name: CI

on:
  push:
    branches: [ main ]
  pull_request: {}
  workflow_dispatch: {} # manual trigger for testing

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - run: task lint

      - run: task test

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # 7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - run: task build

      - run: task release:test

  release:
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - id: check-bump
        run: task tag-release

      - if: ${{ steps.check-bump.output.do_release == 'true' }}
        name: get syft
        run: |
          curl -sSfL https://get.anchore.io/syft | sudo sh -s -- -b /usr/local/bin

      - if: ${{ steps.check-bump.output.do_release == 'true' }}
        run: task release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

